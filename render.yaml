services:
  - type: web
    name: yuzone-api
    env: python
    buildCommand: |
      apt-get update
      apt-get install -y ffmpeg
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DOWNLOAD_WORKER_COUNT
        value: 2
      - key: DOWNLOAD_QUEUE_MAXSIZE
        value: 200
      - key: DOWNLOAD_MAX_RETRIES
        value: 4
      - key: DOWNLOAD_BACKOFF_BASE_SECONDS
        value: 1.5
      - key: DOWNLOAD_BACKOFF_MAX_SECONDS
        value: 45
      - key: DOWNLOAD_JOB_TTL_SECONDS
        value: 3600
      - key: DOWNLOAD_PROVIDER_TIMEOUT_SECONDS
        value: 120
      - key: DOWNLOAD_UPSTREAM_CONCURRENCY
        value: 2
      - key: DOWNLOAD_SYNC_WAIT_SECONDS
        value: 25
      - key: DOWNLOAD_RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: DOWNLOAD_RATE_LIMIT_MAX_REQUESTS
        value: 30
