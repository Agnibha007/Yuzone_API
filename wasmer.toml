# Wasmer App configuration for Yuzone_API

[package]
name = "yuzone-api"
version = "0.1.0"
description = "FastAPI YouTube Music API wrapper"

[env]
# Default port Wasmer will pass to the app
PORT = "8000"

[dependencies]
# Use the Python runner (3.11.x). Wasmer resolves this from its registry.
"python/python" = "^3.11"

[fs]
"/app" = "."

[[command]]
# Start the FastAPI server
name = "start"
runner = "https://webc.org/runner/wasi"
module = "python/python:python"
args = ["-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "$PORT"]